name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart('v')
            $tag = "v$v"
          } else {
            $tag = "${{ github.ref_name }}"
            $v = $tag.TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "Invalid semantic version: $v"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building release $tag (version $v)"

      - name: Build release binary
        shell: pwsh
        run: .\build.ps1 -Release -Version "${{ steps.ver.outputs.version }}"

      - name: Verify version and run self-tests
        shell: pwsh
        run: |
          $out = .\bin\Remo-Console.exe --version
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out.Trim() -ne "Remo-Console ${{ steps.ver.outputs.version }}") {
            throw "Version mismatch: got '$out'"
          }
          & .\bin\Remo-Console.exe --selftest | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed" }

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $dist = Join-Path $PWD "dist"
          $stage = Join-Path $dist "Remo-Console-$tag-win-x64"
          New-Item -ItemType Directory -Force $dist, $stage | Out-Null

          Copy-Item .\bin\Remo-Console.exe $stage\
          Copy-Item .\README.md $stage\
          Copy-Item .\LICENSE $stage\
          Copy-Item .\CHANGELOG.md $stage\

          $zipPath = Join-Path $dist "Remo-Console-$tag-win-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          Copy-Item .\bin\Remo-Console.exe (Join-Path $dist "Remo-Console.exe")

          $sums = @()
          foreach ($f in @("Remo-Console-$tag-win-x64.zip", "Remo-Console.exe")) {
            $h = (Get-FileHash (Join-Path $dist $f) -Algorithm SHA256).Hash.ToLowerInvariant()
            $sums += "$h  $f"
          }
          $sums | Set-Content -Encoding Ascii (Join-Path $dist "SHA256SUMS.txt")
          Get-Content (Join-Path $dist "SHA256SUMS.txt")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Remo-Console ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          files: |
            dist/Remo-Console-${{ steps.ver.outputs.tag }}-win-x64.zip
            dist/Remo-Console.exe
            dist/SHA256SUMS.txt
