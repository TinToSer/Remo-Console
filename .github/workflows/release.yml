name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag format: '$tag'. Expected vMAJOR.MINOR.PATCH (e.g. v1.0.0)."
          }
          $v = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building release $tag (version $v)"

      - name: Build release binary
        shell: pwsh
        run: .\build.ps1 -Release -Version "${{ steps.ver.outputs.version }}"

      - name: Verify version and run self-tests
        shell: pwsh
        run: |
          $out = (& .\bin\Remo-Console.exe --version | Out-String).Trim()
          Write-Host "Version: $out"
          if ($LASTEXITCODE -ne 0 -or $out -ne "Remo-Console ${{ steps.ver.outputs.version }}") {
            throw "Version mismatch: got '$out' (exit $LASTEXITCODE)"
          }
          & .\bin\Remo-Console.exe --selftest | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed (exit $LASTEXITCODE)" }

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $stage = ".\dist\stage"
          $outDir = ".\dist\release"
          New-Item -ItemType Directory -Force $stage, $outDir | Out-Null

          Copy-Item ".\bin\Remo-Console.exe" $stage
          Copy-Item ".\README.md", ".\LICENSE", ".\CHANGELOG.md" $stage

          $zipPath = Join-Path $outDir "Remo-Console-$tag-win-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          Copy-Item ".\bin\Remo-Console.exe" (Join-Path $outDir "Remo-Console.exe")

          $checksums = Get-ChildItem $outDir -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path (Join-Path $outDir "SHA256SUMS.txt") -Encoding ascii
          Get-Content (Join-Path $outDir "SHA256SUMS.txt")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Remo-Console ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/release/Remo-Console.exe
            dist/release/Remo-Console-${{ steps.ver.outputs.tag }}-win-x64.zip
            dist/release/SHA256SUMS.txt
